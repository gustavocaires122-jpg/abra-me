<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Rebeca 💖</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Tahoma,Verdana,sans-serif;
    min-height:100dvh;
    background:linear-gradient(160deg,#ffd1e3 0%,#ffe6f1 45%,#e9d5ff 100%);
    display:flex;align-items:center;justify-content:center;
    padding:16px;overflow:hidden;position:relative;color:#4a2040;
  }
  .heart{position:fixed;bottom:-40px;font-size:20px;opacity:.55;animation:rise linear forwards;pointer-events:none;z-index:0}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

  .win{
    position:relative;z-index:1;width:min(100%,430px);max-height:94dvh;
    display:flex;flex-direction:column;
    background:#fff;border-radius:12px;overflow:hidden;
    border:2px solid #f48fb9;
    box-shadow:0 14px 40px rgba(190,60,120,.35),0 0 0 4px rgba(255,255,255,.5);
    animation:pop .45s cubic-bezier(.2,1.3,.4,1);
  }
  .win.out{animation:out .25s ease forwards}
  .win.shake{animation:shake .4s}
  @keyframes pop{from{transform:scale(.7) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  @keyframes out{to{transform:scale(.9);opacity:0}}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}

  .title{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:linear-gradient(90deg,#ec4899,#f472b6);color:#fff;
    padding:8px 8px 8px 12px;font-size:14px;font-weight:600;flex-shrink:0;
  }
  .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .x{
    width:32px;height:26px;border:none;border-radius:6px;background:rgba(255,255,255,.25);
    color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;
  }
  .x:active{background:#e11d48}

  .body{padding:20px 18px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .body h2{font-size:19px;line-height:1.3;color:#be185d;margin-bottom:10px}
  .body p{font-size:16.5px;line-height:1.6;margin-bottom:12px}
  .letter p{font-size:15.5px}
  .big{font-size:42px;text-align:center;margin-bottom:6px}

  .player{margin:14px 0 6px}
  .player .song{font-size:13px;font-weight:600;color:#be185d;margin-bottom:6px}
  .player iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}

  .ask{
    display:flex;gap:12px;align-items:center;
    padding:14px 18px;background:#fff0f7;border-top:1px solid #fbcfe8;margin-top:6px;
  }
  .ask .ico{font-size:30px;flex-shrink:0}
  .ask .q{font-size:16px;font-weight:600;line-height:1.35}
  .btns{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    padding:12px 18px 18px;background:#fff0f7;flex-shrink:0;
  }
  .btn{
    padding:14px 8px;font-size:17px;font-weight:600;font-family:inherit;
    border:2px solid #ec4899;border-radius:10px;background:#fff;color:#be185d;cursor:pointer;
    transition:transform .1s,background .15s;
  }
  .btn:first-child{background:#ec4899;color:#fff}
  .btn:active{transform:scale(.95)}
  .dots{display:flex;justify-content:center;gap:6px;padding:8px 0 0}
  .dots i{width:8px;height:8px;border-radius:50%;background:#fbcfe8}
  .dots i.on{background:#ec4899}
  .ask-wrap{flex-shrink:0}
  .sign{text-align:right;font-weight:600;color:#be185d}
  .buque{display:flex;justify-content:center;margin:4px 0 10px}
  .buque svg{max-width:100%;height:auto;overflow:visible}
  .sway{transform-box:view-box;transform-origin:120px 222px;animation:sway 4s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
  .bl{
    animation-name:bloom,breath;animation-duration:1s,3.2s;
    animation-timing-function:cubic-bezier(.2,1.4,.4,1),ease-in-out;
    animation-iteration-count:1,infinite;animation-direction:normal,alternate;
    animation-fill-mode:both,none;
    animation-delay:var(--d,0s),calc(var(--d,0s) + 1.2s);
  }
  @keyframes bloom{from{transform:scale(0) rotate(-50deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes breath{from{transform:scale(1)}to{transform:scale(1.07)}}
  .tw{transform-box:fill-box;transform-origin:center;opacity:0;animation:tw 2.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.sway,.bl,.tw{animation:none;opacity:1}}
  .fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
  .fotos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:3px solid #fbcfe8;box-shadow:0 4px 12px rgba(190,60,120,.25)}
</style>
</head>
<body>
<div id="app"></div>

<script>
const NOME = "Rebeca Ganacin";
const E = "https://open.spotify.com/embed/track/";
const motivos = [
  {t:"Você é quem eu conto pra tudo",
   p:"Tudo mesmo. Quando eu tô triste, você vem e sempre me dá os melhores conselhos e me faz melhorar automaticamente. Parece que você sempre sabe exatamente o que falar, mesmo quando nem eu sei o que eu tô sentindo. Você me escuta de verdade, sem me julgar, e isso faz uma diferença enorme pra mim. Saber que eu tenho você pra desabafar me deixa muito mais leve.",
   s:"The Neighbourhood – Sweater Weather", id:"2QjOHCTQ1Jl3zawyYOpxh6"},

   p:"Você é uma serva muito fiel a Ele e sua relação com Ele é de um pai e de um melhor amigo, alguém que você conta tudo. E isso é muito admirável de ver, a maneira que você se esforça pra estar mais perto Dele.",
   s:"Lugar Secreto", id:"4D9IlElQlDZrIjvHnPDxbZ"}

const carta = [
  "Espero que você tenha gostado, dei o meu melhor pra fazer isso. Nunca esqueça da menina incrível que você é, cheia da presença de Deus. Eu desejo do fundo do meu coração que todos os seus sonhos se realizem e desejo que esses 16 anos sejam incríveis.",
  "Eu fiz com 7 motivos porque na Bíblia, frequentemente, o número 7 é associado à perfeição. E pra mim você chega muito perto de ser perfeita, Rebeca.",
  "Eu te amo e conta comigo pra tudo."

const app = document.getElementById("app");
let step = -1; // -1 intro, 0..6 motivos, 7 carta

function dots(n){
  let h='<div class="dots">';
  for(let i=0;i<7;i++) h+=`<i class="${i<=n?'on':''}"></i>`;
  return h+'</div>';
}
function buttons(){
  return `<div class="btns"><button class="btn" data-next>Sim</button><button class="btn" data-next>Claro</button></div>`;
}
function player(m){
  return `<div class="player">
    ${m.s?`<div class="song">🎵 ${m.s}</div>`:''}
    <iframe src="${E}${m.id}" width="100%" height="152" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>`;
}

function fotos(m){
  if(!m.fotos) return '';
  return `<div class="fotos">
    <img src="foto1.jpg" alt="Cachorrinha golden">
    <img src="foto2.jpg" alt="Cachorrinha shih tzu">
  </div>`;
}

function html(){

      ${buttons()}</div></div>`;
  }
  if(step<7){
    const m=motivos[step];
    const q = step<6 ? `Deseja ver o motivo ${step+2}?` : `Deseja ver a carta final?`;

      <div class="title"><span>💗 Motivo ${step+1} de 7</span><button class="x" data-x>✕</button></div>

}

function render(){
  app.innerHTML = html();
  const w = app.firstElementChild;
  w.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{
    w.classList.add("out");
    setTimeout(()=>{step++;render();confetti(6)},250);
  });
  const x = w.querySelector("[data-x]");
  x.onclick=()=>{w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake")};
}

function heart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["💖","💕","🌸","💗","✨"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(14+Math.random()*22)+"px";
  h.style.animationDuration=(6+Math.random()*6)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),12500);
}
function confetti(n){for(let i=0;i<n;i++)setTimeout(heart,i*120)}

setInterval(heart,900);
confetti(8);
render();

</html>
